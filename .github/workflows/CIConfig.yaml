name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    environment: Test

    permissions:
      contents: read

    outputs:
      has_allure_results: ${{ steps.check-allure.outputs.has_results }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: ./mvnw --batch-mode checkstyle:check

      - name: Prepare test environment
        run: infra/restart-docker-images.sh

      - name: Run tests
        run: ./mvnw --batch-mode clean verify

      - name: Check Allure results
        id: check-allure
        if: always()
        run: |
          if [ -d target/allure-results ] && \
             [ "$(find target/allure-results -type f | wc -l)" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            echo "Allure results found"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "Allure results not found"
          fi

      - name: Upload Allure results
        if: always() && steps.check-allure.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 7

      - name: Clean up test environment
        if: always()
        run: docker compose -f infra/docker-compose.yaml down -v


  publish-report:
    name: Publish Allure report

    needs:
      - run-tests

    if: >
      always() &&
      needs.run-tests.outputs.has_allure_results == 'true'
#      github.ref == 'refs/heads/master' &&

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: target/allure-results

      - name: Load Allure history
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history