name: CI

on: push

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    environment: Test

    permissions:
      contents: read

    env:
      OMRS_DB_NAME: ${{ secrets.OMRS_DB_NAME }}
      OMRS_DB_USER: ${{ secrets.OMRS_DB_USER }}
      OMRS_DB_HOST: ${{ secrets.OMRS_DB_HOST }}
      OMRS_DB_PASSWORD: ${{ secrets.OMRS_DB_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      OMRS_ENCRYPTION_KEY: ${{ secrets.OMRS_ENCRYPTION_KEY }}
      OMRS_ENCRYPTION_VECTOR: ${{ secrets.OMRS_ENCRYPTION_VECTOR }}
#      OPENMRS_INTEGRATION_ENABLED: true
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    outputs:
      has_allure_results: ${{ steps.check-allure.outputs.has_results }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle report
        run: ./mvnw --batch-mode checkstyle:checkstyle

      - name: Prepare test environment
        run: infra/restart-docker-images.sh

      - name: Run tests
        run: >
          ./mvnw --batch-mode clean verify
#          -Dopenmrs.integration.enabled=${OPENMRS_INTEGRATION_ENABLED}

      - name: Run Swagger coverage
        if: always()
        run: |
          ./swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s ./openmrs-api.json \
            -i target/swagger-coverage-output

      - name: Show api coverage
        if: always()
        run: infra/check-api-coverage.sh

      - name: Upload Swagger coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swagger-coverage-report
          path: swagger-coverage-report.html
          retention-days: 7

      - name: Check Allure results
        id: check-allure
        if: always()
        run: |
          if [ -d target/allure-results ] && \
             [ "$(find target/allure-results -type f | wc -l)" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            echo "Allure results found"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "Allure results not found"
          fi

      - name: Upload Allure results
        if: always() && steps.check-allure.outputs.has_results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 7

      - name: Clean up test environment
        if: always()
        run: docker compose -f infra/docker-compose.yaml down -v


  publish-report:
    name: Publish Allure report

    needs:
      - run-tests

    if: >
      always()
#      && needs.run-tests.outputs.has_allure_results == 'true' &&
#      github.event_name == 'push' &&
#      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: target/allure-results

      - name: Download Swagger coverage report
        uses: actions/download-artifact@v5
        with:
          name: swagger-coverage-report
          path: swagger-report

      - name: Load Allure history
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Add Swagger coverage report to Allure
        run: |
          sudo cp swagger-report/swagger-coverage-report.html \
            allure-history/${{ github.run_number }}/swagger-coverage-report.html

      - name: Prepare CI reports artifact
        run: |
          mkdir -p ci-reports/allure-report

          sudo cp -R \
            allure-history/${{ github.run_number }}/. \
            ci-reports/allure-report/

          cp \
            swagger-report/swagger-coverage-report.html \
            ci-reports/swagger-coverage-report.html

          sudo chown -R "$(id -u):$(id -g)" ci-reports

          echo "CI reports:"
          find ci-reports -maxdepth 2 -type f | sort

      - name: Upload CI reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: ci-reports
          retention-days: 30

      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history